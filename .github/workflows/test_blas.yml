name: Test SciPy Versions and BLAS Architectures

on:
  workflow_dispatch:

jobs:
  test-x64:
    name: "x64 / ${{ matrix.runner }} / Target: ${{ matrix.coretype }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
        coretype:
          - "AUTO"
          - "HASWELL"
          - "ZEN"
          - "SKYLAKEX"
          - "NEHALEM"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SciPy 1.17.1 & 1.18.1 sequentially
        shell: bash
        run: |
          if [ "${{ matrix.coretype }}" != "AUTO" ]; then
            export OPENBLAS_CORETYPE="${{ matrix.coretype }}"
          fi

          SCIPY_VERSIONS=("1.17.1" "1.18.1")

          for VER in "${SCIPY_VERSIONS[@]}"; do
            echo ">>> Testing with SciPy $VER on Target: ${{ matrix.coretype }} <<<"
            python -m venv "env_$VER"
            
            # Activate virtualenv cross-platform
            if [ -f "env_$VER/bin/activate" ]; then
              source "env_$VER/bin/activate"
            else
              source "env_$VER/Scripts/activate"
            fi
            
            pip install --upgrade pip
            pip install numpy "scipy==$VER"
            python test_script.py
            
            deactivate
            rm -rf "env_$VER"
          done

  test-arm64:
    name: "arm64 / ${{ matrix.runner }} / Target: ${{ matrix.coretype }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - windows-11-arm
          - macos-latest
        coretype:
          - "AUTO"
          - "ARMV8"
          - "NEOVERSEV1"
          - "CORTEXA57"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SciPy 1.17.1 & 1.18.1 sequentially
        shell: bash
        run: |
          if [ "${{ matrix.coretype }}" != "AUTO" ]; then
            export OPENBLAS_CORETYPE="${{ matrix.coretype }}"
          fi

          SCIPY_VERSIONS=("1.17.1" "1.18.1")

          for VER in "${SCIPY_VERSIONS[@]}"; do
            echo ">>> Testing with SciPy $VER on Target: ${{ matrix.coretype }} <<<"
            python -m venv "env_$VER"

            if [ -f "env_$VER/bin/activate" ]; then
              source "env_$VER/bin/activate"
            else
              source "env_$VER/Scripts/activate"
            fi

            pip install --upgrade pip
            pip install numpy "scipy==$VER"
            python test_script.py

            deactivate
            rm -rf "env_$VER"
          done
